name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (API)
        run: npm run lint --workspace=apps/api

      - name: Lint (Web)
        run: npm run lint --workspace=apps/web

      - name: Build (API)
        run: npm run build --workspace=apps/api

      - name: Build (Web)
        run: npm run build --workspace=apps/web

  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (API)
        run: npm test --workspace=apps/api
        env:
          NODE_ENV: test
          PORT: '5000'
          MONGO_URI: mongodb://localhost:27017/ibms_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_minimum_32_characters_long
          JWT_REFRESH_SECRET: test_refresh_secret_minimum_32_characters
          CLOUDINARY_URL: cloudinary://test:test@test
          RESEND_API_KEY: re_test_key_placeholder_for_ci_only
          CLIENT_URL: http://localhost:3000
