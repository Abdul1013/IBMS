services:
  - type: web
    name: ibms-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: 'npm ci && npm run build --workspace=apps/api'
    startCommand: 'node apps/api/dist/server.js'
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
